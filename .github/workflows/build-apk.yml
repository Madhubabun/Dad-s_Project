# Builds the Android app (APK) and publishes it on the repository's
# Releases page, ready to download and send on WhatsApp.
#
# Runs on every change to the app, or by hand from the Actions tab
# ("Build APK" → "Run workflow").
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Run tests (interest calculator rules)
        run: flutter test

      # The signing key must be the same for every build, otherwise a new
      # APK will not install over the old one on Dad's phone.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing key secrets are missing. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=raitheraju
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      # Version 1.0.<run number>; the build number must go up every time so
      # Android accepts the new APK as an update.
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk \
             "RaitheRaju-1.0.${{ github.run_number }}.apk"

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Raithe Raju 1.0.${{ github.run_number }}
          body: |
            Download the .apk file below and send it to Dad on WhatsApp.
            Installing it over the old version keeps all his saved data.
          files: app/RaitheRaju-1.0.${{ github.run_number }}.apk
          make_latest: true
