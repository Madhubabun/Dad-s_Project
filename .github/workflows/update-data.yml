# Schedules for the live data. Times are UTC (IST = UTC + 5:30).
# GitHub may start scheduled runs a few minutes late; that is fine here.
#
# To run one by hand: Actions tab → "Update data" → "Run workflow".
name: Update data

on:
  schedule:
    - cron: "17 * * * *" # weather: every hour at :17
  workflow_dispatch:
    inputs:
      source:
        description: Which data to update
        type: choice
        options: [weather]
        default: weather

jobs:
  weather:
    if: github.event_name == 'schedule' && github.event.schedule == '17 * * * *' || inputs.source == 'weather'
    uses: ./.github/workflows/update-section.yml
    with:
      source: weather
    secrets: inherit
