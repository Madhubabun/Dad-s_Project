# Prints what the real data sources return, so the backend scripts are
# written against real field names and page layouts. Safe to run any time:
# it only reads and prints, nothing is saved.
name: Inspect data sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/inspect/**"
      - ".github/workflows/inspect-sources.yml"

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: python backend/inspect/inspect_weather.py

  mandi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: python backend/inspect/inspect_mandi.py
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}

  dam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Save raw KSNDMC pages and push them to the inspect-output branch
        run: |
          python backend/inspect/save_pages.py $(cat backend/inspect/pages.txt)
          python backend/inspect/inspect_ksndmc_api.py
          cd inspect-output
          git init -q -b inspect-output && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Raw pages"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" inspect-output
